# Konfigurasi Nginx untuk Sistem Monitoring Multi-Greenhouse (Raspberry Pi 5)
#
# Pasang:
#   sudo cp deploy/nginx/greenhouse.conf /etc/nginx/sites-available/greenhouse
#   sudo ln -s /etc/nginx/sites-available/greenhouse /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sesuaikan: server_name, root, dan versi PHP-FPM (cek: ls /run/php/).

server {
    listen 80;
    listen [::]:80;

    # Ganti dengan IP/hostname Raspberry Pi, misal: 192.168.1.50
    server_name greenhouse.local;

    root /var/www/greenhouse-bahari/public;
    index index.php;

    charset utf-8;
    client_max_body_size 8m;

    # Aset statis ber-hash dari Vite: cache panjang.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Jangan expose file internal Laravel bila root salah konfigurasi.
    location ~ /\.env {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/greenhouse.access.log;
    error_log  /var/log/nginx/greenhouse.error.log;
}
